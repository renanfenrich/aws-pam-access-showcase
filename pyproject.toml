[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-pam-access-showcase"
version = "0.1.0"
description = "Verification and reconciliation tooling for the AWS PAM showcase"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.64",
  "botocore==1.43.64",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.1",
  "types-requests==2.33.0.20260712",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/policy"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/_terraform.py" = ["S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
