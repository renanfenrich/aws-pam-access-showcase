---
name: Deploy showcase

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact commit SHA on main
        required: true
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
        type: string
      deployment_id:
        description: Deterministic deployment identifier
        required: true
        type: string
      authorization_expiration:
        description: JumpServer authorization expiration in RFC3339
        required: true
        type: string
      confirmation:
        description: Type APPLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aws-pam-access-showcase
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply and verify protected showcase
    if: github.ref_name == 'main'
    environment: showcase-apply
    permissions:
      contents: read
      id-token: write # Exchange GitHub's OIDC token for the deploy role.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_deployment_enabled: "true"
      TF_VAR_aws_region: ${{ inputs.aws_region }}
      TF_VAR_deployment_id: ${{ inputs.deployment_id }}
      TF_VAR_operator_cidr: ${{ vars.OPERATOR_CIDR }}
      TF_VAR_authorization_expiration: ${{ inputs.authorization_expiration }}
      TF_VAR_expiration: ${{ vars.EXPIRATION }}
      TF_VAR_deployment_role_arn: ${{ vars.DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ inputs.aws_region }}
      REQUESTED_GIT_REF: ${{ inputs.git_ref }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
    steps:
      - name: Validate explicit confirmation
        shell: bash
        run: |
          [[ "$APPLY_CONFIRMATION" == APPLY ]] || { echo "confirmation must equal APPLY" >&2; exit 2; }

      - name: Check out the exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact commit to belong to main
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_GIT_REF" ]] || { echo "git_ref must be a full commit SHA" >&2; exit 2; }
          git merge-base --is-ancestor HEAD origin/main || { echo "git_ref is not on main" >&2; exit 2; }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install pinned deployment and validation tools
        shell: bash
        run: |
          source versions.env
          python -m pip install --disable-pip-version-check \
            ".[dev]" \
            "ansible-core==$ANSIBLE_CORE_VERSION" \
            "ansible-lint==$ANSIBLE_LINT_VERSION" \
            "yamllint==$YAMLLINT_VERSION" \
            "zizmor==$ZIZMOR_VERSION"
          ansible-galaxy collection install --force -r ansible/requirements.yml
          TOOL_BIN_DIR="$RUNNER_TEMP/tools" scripts/install_ci_tools.sh
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Authenticate with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-showcase-deploy

      - name: Repeat all static validation
        run: make ci

      - name: Initialize protected remote state
        run: |
          terraform -chdir=terraform/environments/showcase init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=showcase/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Generate a fresh deployment plan
        run: terraform -chdir=terraform/environments/showcase plan -no-color -out="$RUNNER_TEMP/deploy.tfplan" >/dev/null

      - name: Apply the reviewed commit
        run: terraform -chdir=terraform/environments/showcase apply -auto-approve "$RUNNER_TEMP/deploy.tfplan" >/dev/null

      - name: Wait for all managed nodes
        shell: bash
        run: scripts/wait_for_ssm.sh terraform/environments/showcase "$AWS_REGION"

      - name: Create absent secret values only
        run: python scripts/ensure_secrets.py --terraform-dir terraform/environments/showcase --region "$AWS_REGION"

      - name: Build deterministic SSM inventory
        run: python scripts/build_inventory.py --terraform-dir terraform/environments/showcase --output ansible/inventories/generated.yml --region "$AWS_REGION"

      - name: Configure all managed nodes through Systems Manager
        run: ansible-playbook -i ansible/inventories/generated.yml ansible/playbooks/configure.yml

      - name: Prove Ansible idempotence
        shell: bash
        run: |
          ansible-playbook -i ansible/inventories/generated.yml ansible/playbooks/configure.yml | tee "$RUNNER_TEMP/ansible-second-run.log"
          python scripts/parse_ansible_recap.py "$RUNNER_TEMP/ansible-second-run.log" evidence/ansible-idempotence.json

      - name: Run managed-node and AWS verification
        run: |
          ansible-playbook -i ansible/inventories/generated.yml ansible/playbooks/verify.yml
          python scripts/verify_aws.py --terraform-dir terraform/environments/showcase --evidence-dir evidence --region "$AWS_REGION"

      - name: Prove Terraform idempotence
        shell: bash
        run: |
          set +e
          terraform -chdir=terraform/environments/showcase plan -detailed-exitcode -no-color >/dev/null
          plan_status=$?
          set -e
          if [[ $plan_status -eq 0 ]]; then status=pass; else status=fail; fi
          jq -n --arg status "$status" '{controls:[{control:"second-plan-no-changes",status:$status}]}' > evidence/terraform-idempotence.json
          [[ $plan_status -eq 0 ]]

      - name: Generate sanitized evidence summary
        run: python scripts/summarize_evidence.py evidence

      - name: Upload only sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-pam-evidence-${{ inputs.deployment_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Publish deployment summary
        run: cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Clean runner secret files
        if: always()
        shell: bash
        run: |
          scripts/cleanup_runner_secrets.sh
          shred -u "$RUNNER_TEMP/deploy.tfplan" "$RUNNER_TEMP/ansible-second-run.log" 2>/dev/null || true
