---
- name: Generate a new target SSH credential in Secrets Manager
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Create a new secret version without logging key material
      ansible.builtin.command:
        argv:
          - python3
          - scripts/rotate_demo_credentials.py
          - --secret-name
          - "{{ secret_names['sensitive-resource-ssh-key'] }}"
          - --region
          - "{{ aws_region }}"
      changed_when: true
      no_log: true

- name: Apply the rotated public key to the isolated resource
  hosts: sensitive_resource
  become: true
  gather_facts: false
  roles:
    - role: sensitive_resource

- name: Reconcile the rotated managed account credential
  hosts: jumpserver
  become: true
  gather_facts: false
  roles:
    - role: jumpserver_bootstrap
