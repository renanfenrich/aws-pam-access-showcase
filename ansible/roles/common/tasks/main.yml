---
- name: Install baseline packages
  ansible.builtin.dnf:
    name:
      - audit
      - chrony
      - jq
      - openssl
      - python3
      - tar
    state: present

- name: Enable time synchronization and audit logging
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - auditd
    - chronyd

- name: Disable password and root SSH authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-aws-pam-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PermitEmptyPasswords no
      X11Forwarding no
      AllowTcpForwarding no
  notify: Restart sshd

- name: Apply baseline kernel hardening
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  loop:
    - { name: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { name: net.ipv4.conf.default.accept_redirects, value: "0" }
    - { name: net.ipv4.conf.all.send_redirects, value: "0" }
    - { name: net.ipv4.conf.all.accept_source_route, value: "0" }
    - { name: kernel.randomize_va_space, value: "2" }

- name: Ensure the SSM agent remains enabled
  ansible.builtin.systemd_service:
    name: amazon-ssm-agent
    enabled: true
    state: started
